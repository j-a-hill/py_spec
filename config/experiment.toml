# Experiment declaration for the in-crystallo UV-vis dataset.
#
# R37S HGD microcrystals in an EVAL thin-film sandwich, probed on a
# fibre-coupled Andor SR303i / DU970P spectrograph while being irradiated
# with X-rays at a series of attenuator settings.  Beamtime mx29074-47,
# 22 September 2023.
#
# Every raw file is assigned to a condition here rather than inferred from
# its name: the beamline naming is inconsistent (see registry.py) and an
# explicit table is auditable.

raw_dir = "../HGD_nanospec/mx29074-47"

# --------------------------------------------------------------------------
# Dose model
# --------------------------------------------------------------------------
# From the RADDOSE-3D run supplied with the dataset ("raddose out.docx"):
#   Top hat beam 50.0 x 50.0 um, 5.0e12 photons/s at 12.4 keV
#   cuboid crystal 20 x 20 x 5 um, solvent fraction 89.59 %
#   0.1 s exposure -> Average Dose (Whole Crystal) = 0.104181 MGy
#
# The spectrometer runs a continuous kinetic series with a 0.1 s cycle, so
# absorbed dose accumulates linearly with elapsed time.  The value below is
# the dose rate at 100 % transmission; each condition scales it by its
# nominal attenuator transmission.
#
# CAVEAT, to be resolved before the numbers are quoted in the thesis: the
# chapter methods state a 20 x 20 um beam and 8e12 ph/s for the I24
# time-resolved experiment, whereas this RADDOSE run used 50 x 50 um and
# 5e12 ph/s.  If the spectroscopy beam differed from the value modelled
# here, every dose axis rescales by a constant factor -- relative
# comparisons between transmission levels are unaffected.
[dose]
raddose_dose_per_exposure_MGy = 0.104181
raddose_exposure_s = 0.1
dose_rate_MGy_per_s_at_100pct = 1.04181
# Alternative metrics reported by the same RADDOSE run, for the caveat table.
raddose_max_dose_MGy = 0.104211
raddose_diffraction_weighted_MGy = 0.052090

# --------------------------------------------------------------------------
# Reference measurements (single Accumulate spectra, not kinetic series)
# --------------------------------------------------------------------------
[references]
DTNB_RT = "DTNB_RT.asc"
buffer_RT = "buffer_RT.asc"
DTNB_cryo = "DTNB_cryo.asc"
buffer_cryo = "buffer_cryo.asc"
DTNB_RT_xrays = "DTNB_RT_xrays.asc"
buffer_RT_xrays = "buffer_RT_xrays.asc"
DTNB_cryo_xrays = "DTNB_cryo_xrays.asc"

