# --------------------------------------------------------------------------
# Analysis windows (nm)
# --------------------------------------------------------------------------
[windows]
# Region where no chromophore in this system absorbs; used to fit and remove
# the crystal scattering background.
scatter_fit = [470.0, 725.0]
# TNB absorbance band (412 nm maximum in solution).
tnb = [395.0, 430.0]
# Region that gains absorbance under irradiation in both soak states.
uv_growth = [300.0, 325.0]
# Internal zero: scatter-corrected absorbance should sit at zero here.
internal_zero = [470.0, 500.0]
# Below this the detector is shot-noise dominated in these films.
analysis_min = 280.0
analysis_max = 725.0
