[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalspec"
version = "0.1.0"
description = "In-crystallo UV-visible absorption spectroscopy of HGD microcrystals"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "matplotlib>=3.7"]

[tool.setuptools.packages.find]
where = ["src"]
